services:
  - type: web
    name: tavryx
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CASPIAN_API_KEY
        sync: false
      - key: CASPIAN_BASE_URL
        value: https://api.trycaspianai.com
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: "45"
      - key: TAVRYX_DB_PATH
        value: /app/data/tavryx.db
      - key: APP_ENV
        value: production
      - key: TAVRYX_FAST_THINKING_LEVEL
        value: minimal
      - key: TAVRYX_COMPLEX_THINKING_LEVEL
        value: low
      - key: TAVRYX_CRITICAL_THINKING_LEVEL
        value: medium
      - key: TAVRYX_MAX_CONTEXT_MESSAGES
        value: "8"
      - key: TAVRYX_MAX_OUTPUT_TOKENS
        value: "1200"
      - key: TAVRYX_CANDIDATE_SITUATIONS
        value: "8"
      - key: TAVRYX_HISTORY_PER_SITUATION
        value: "8"
      - key: TAVRYX_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: TAVRYX_API_TOKEN
        sync: false
